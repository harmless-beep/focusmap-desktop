[workspace]
resolver = "2"
members = ["crates/focusmap-core", "crates/focusmap-app", "crates/focusmap-city"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Keep the shipped binary small and the idle footprint predictable.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
