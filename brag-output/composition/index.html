<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0B0E1A"},
    {"id":"color-ink","type":"color","label":"Text","default":"#F4F6FC"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#8B5CF6"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display), Inter, sans-serif; }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(circle at 62% 38%, rgba(139, 92, 246, 0.16) 0%, rgba(11, 14, 26, 0) 58%),
          var(--color-ground);
      }
      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="19"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="bg" data-layout-ignore></div>

      <div id="hook" class="scene-host clip" data-composition-id="hook"
           data-composition-src="compositions/hook.html" data-start="0"
           data-duration="3" data-track-index="1" data-track-kind="graphics"></div>
      <div id="today" class="scene-host clip" data-composition-id="today"
           data-composition-src="compositions/today.html" data-start="3"
           data-duration="4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="appolis" class="scene-host clip" data-composition-id="appolis"
           data-composition-src="compositions/appolis.html" data-start="7"
           data-duration="4" data-track-index="3" data-track-kind="graphics"></div>
      <div id="share" class="scene-host clip" data-composition-id="share"
           data-composition-src="compositions/share.html" data-start="11"
           data-duration="4" data-track-index="4" data-track-kind="graphics"></div>
      <div id="outro" class="scene-host clip" data-composition-id="outro"
           data-composition-src="compositions/outro.html" data-start="15"
           data-duration="4" data-track-index="5" data-track-kind="graphics"></div>

      <audio id="bg-music" class="clip" data-start="0" data-duration="19"
             data-track-index="10" data-volume="0.35" data-fade-in="0.4"
             data-fade-out="2.4"
             src="assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-today" class="clip" data-start="3.2" data-duration="0.11"
             data-track-index="11" data-volume="0.65"
             src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-appolis" class="clip" data-start="7.2" data-duration="0.19"
             data-track-index="12" data-volume="0.6"
             src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-share" class="clip" data-start="11.2" data-duration="0.19"
             data-track-index="13" data-volume="0.6"
             src="assets/sfx/interface/drop_003.ogg"></audio>
      <audio id="sfx-outro" class="clip" data-start="15.4" data-duration="1.4"
             data-track-index="14" data-volume="0.7"
             src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
